<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker Calculator</title><style>body{font-family:Arial;background:#121212;color:#fff;padding:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.card{padding:8px;border-radius:8px;border:1px solid #555;background:#222;color:#fff}.red{color:#ff6b6b}.slot{display:inline-block;width:60px;height:80px;border:2px dashed #666;margin:4px;padding:4px}.selected{opacity:.35}button{padding:10px;margin:5px;border-radius:8px}</style></head><body><h2>Mobile Poker Calculator</h2><p>Select 2 hole cards then up to 5 board cards.</p><div>Hole:<div id="hole"></div></div><div>Board:<div id="board"></div></div><div class="grid" id="deck"></div><p>Opponents <input id="opp" type="number" value="1" min="1" max="9"></p><button onclick="calc()">Calculate</button><div id="out"></div><script>const suits=['♠','♥','♦','♣'];const ranks=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];let cards=[];let selected=[];const deck=document.getElementById('deck');ranks.forEach(r=>suits.forEach(s=>{let c=r+s;cards.push(c);let b=document.createElement('button');b.className='card '+((s==='♥'||s==='♦')?'red':'');b.innerText=c;b.onclick=()=>pick(c,b);deck.appendChild(b)}));function render(){document.getElementById('hole').innerHTML=selected.slice(0,2).map(x=>'<span class=slot>'+x+'</span>').join('');document.getElementById('board').innerHTML=selected.slice(2).map(x=>'<span class=slot>'+x+'</span>').join('')}function pick(c,b){if(selected.length>=7)return;selected.push(c);b.disabled=true;b.classList.add('selected');render()}function calc(){const opp=parseInt(document.getElementById('opp').value)||1;let eq=50;if(selected.length>=2){const h=selected[0][0]+selected[1][0];if(h==='AA'||h==='KK'||h==='QQ')eq=85;else if(h.includes('A')&&h.includes('K'))eq=67;}eq=Math.max(5,eq-(opp-1)*6);let rec=eq>60?'RAISE':'CALL';if(eq<35)rec='FOLD';document.getElementById('out').innerHTML='<h3>Equity ~'+eq+'%</h3><h2>'+rec+'</h2><p>Selected: '+selected.join(' ')+'</p>';}render();</script></body></html>
